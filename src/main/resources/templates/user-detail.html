<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title th:text="'User ' + ${user.id}">User</title>
    <link rel="stylesheet" th:href="@{/global.css}" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<!-- Nav -->
<div th:replace="fragments/navbar :: slayNav(${activeTab})"></div>

<!-- Users list -->
<section>
    <h2 class="text-4xl font-bold my-6">
        @<span th:text="${user.getUsername()}">username</span>
        <span class="text-sm text-gray-500 ml-3">
    <span th:text="${connectionDegree != null ? connectionDegree : '-'}">-</span>
  </span>
    </h2>

    <form th:if="${!isSelf}" th:action="@{|/SlayScale/user/follow/${user.id}|}" method="post">
        <button type="submit"
                class="uppercase btn"
                th:text="${isFollowing} ? 'Unfollow' : 'Follow'">
            Follow
        </button>
    </form>

    <div class="flex flex-wrap gap-2">
        <a th:each="r : ${reviews}"
           class="card flex flex-col w-full sm:w-60 md:w-72 lg:w-80 border border-pink-200 p-4 "

           style="text-decoration:none; color:inherit;">

            <div><b>Rating:</b> <span th:text="${r.rating}">5</span></div>
            <div><b>Text:</b> <span th:text="${r.text}">Great!</span></div>
            <div class="muted">
                <span>Review ID: </span><span th:text="${r.id}">10</span>
            </div>
        </a>
    </div>
</section>

</body>
</html>
