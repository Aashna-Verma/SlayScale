<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Product ' + ${product.id}">Product</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" th:href="@{/global.css}" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="overflow-x-hidden">

<div class="blurry-bg w-screen h-screen -z-10 top-0 left-0 absolute">
    <div class="background opacity-75 -z-10 rounded-full top-[40vh] left-[10vw] absolute bg-[#ADE48B] blur-[120px] w-200 h-120"></div>
    <div class="background opacity-65 -z-10 rounded-full top-[20vh] left-[45vw] absolute bg-[#FF47A0] blur-[100px] w-130 h-96"></div>
</div>

<!-- Nav -->
<div th:replace="fragments/navbar :: slayNav(${activeTab})"></div>

<div class="flex flex-col sm:flex-row gap-10" >
<!-- Product info -->
<section class="card-bg p-10 w-full max-w-96 flex flex-col justify-between h-[80vh]">
    <div class="flex flex-col gap-2">

        <div class="w-full h-70 bg-gray-200 rounded-3xl overflow-hidden border border-pink-300">
            <img th:if="${product.imageUrl != null}"
                 th:src="${product.imageUrl}"
                 class="w-full h-full object-cover"
                 onerror="this.style.display='none'; this.parentElement.classList.add('fallback');">
        </div>

        <div class="text-xs py-1 px-2 rounded-md bg-pink-200 uppercase w-fit" th:text="${product.category}">ELECTRONICS</div>
        <h1 class="text-4xl font-bold" th:text="${product.id} + ' ' + ${product.name}">name</h1>
    </div>


    <div class="flex flex-col gap-4">
    <a th:href="${product.url}" th:target="_blank">
        <button type="button"
                class="btn btn-outline">
            Link
        </button>
    </a>

    <button type="button"
            class="btn"
            onclick="openAddReviewModal()">
        <img class="size-6" src="/assets/plus.svg"/> Add Review
    </button>
    </div>
</section>

<!-- Reviews -->
<section class="w-full">
    <h2 class="text-4xl font-bold my-6" >Reviews</h2>

    <!-- Sort / Filter controls -->
    <form method="get" class="controls flex flex-col sm:flex-row space-x-6 mb-10">
        <div class="flex flex-col w-full">
        <label class="uppercase"  for="sort">Sort</label>
        <select class="!rounded-full !border-pink-400 px-4" id="sort" name="sort" th:value="${sort}" onchange="this.form.submit()">
            <option value="newest" th:selected="${sort == 'newest'}">Newest</option>
            <option value="oldest" th:selected="${sort == 'oldest'}">Oldest</option>
            <option value="rating_desc" th:selected="${sort == 'rating_desc'}">Highest rating</option>
            <option value="rating_asc" th:selected="${sort == 'rating_asc'}">Lowest rating</option>
            <option value="similarity" th:selected="${sort == 'similarity'}">Most similar users</option>

        </select>
        </div>

        <div class="flex flex-col w-full">
        <label class="uppercase" for="minRating">Min rating</label>
        <select class="!rounded-full !border-pink-400 px-4" id="minRating" name="minRating" th:value="${minRating}" onchange="this.form.submit()">
            <option value="0" th:selected="${minRating == 0}">All</option>
            <option value="1" th:selected="${minRating == 1}">1+</option>
            <option value="2" th:selected="${minRating == 2}">2+</option>
            <option value="3" th:selected="${minRating == 3}">3+</option>
            <option value="4" th:selected="${minRating == 4}">4+</option>
            <option value="5" th:selected="${minRating == 5}">5 only</option>
        </select>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(reviews)}" class="muted">No reviews yet.</div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div class="card-bg !rounded-3xl flex flex-col w-full p-4" th:each="r : ${reviews}">
            <!-- Link to user profile -->
            <a class="font-bold text-lg" th:href="@{/SlayScale/users/{id}(id=${r.author.id})}">
                <p>@<span th:text="${r.author.username}">author</span></p>
            </a>

            <!-- Stars + rating -->
            <div>
                <!-- Filled stars -->
                <span class="text-pink-500" th:each="i : ${#numbers.sequence(1, r.rating)}">
                    <i class="bi bi-star-fill fs-3"></i>
                </span>

                <!-- Empty stars -->
                <span class="text-pink-500" th:if="${r.rating < 5}"
                      th:each="i : ${#numbers.sequence(1, 5 - r.rating)}">
                    <i class="bi bi-star fs-3"></i>
                </span>
            </div>

            <!-- Review text -->
            <p th:text="${r.text}">Great!</p>
        </div>
    </div>
</section>
</div>

<!-- Add Review Modal -->
<div id="addReviewModal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 hidden">

    <div class="card-bg !bg-white/70 m-4 flex flex-col space-y-10 w-full max-w-150 p-10 relative">

        <!-- Close button -->
        <button type="button"
                class="absolute top-10 right-10 text-gray-500 hover:text-gray-800"
                onclick="closeAddReviewModal()">
            ✕
        </button>

        <h3 class="text-2xl font-bold">Add a Review</h3>

        <form class="flex flex-col space-y-10"
              th:action="@{|/SlayScale/products/${product.id}/reviews|}"
              method="post">

            <div>
                <label for="rating">Rating (1–5)</label>

                <!-- Hidden input that stores final value -->
                <input id="rating" name="rating" type="number" min="1" max="5" required hidden>

                <!-- Visible star rating UI -->
                <div id="starRating" class="d-flex gap-1 text-pink-500">
                    <i class="bi bi-star text-4xl" data-value="1"></i>
                    <i class="bi bi-star text-4xl" data-value="2"></i>
                    <i class="bi bi-star text-4xl" data-value="3"></i>
                    <i class="bi bi-star text-4xl" data-value="4"></i>
                    <i class="bi bi-star text-4xl" data-value="5"></i>
                </div>
            </div>

            <div>
                <label for="text">Text</label>
                <textarea id="text" name="text" rows="4" placeholder="Write your thoughts..." required></textarea>

            </div>

            <input type="hidden"
                   th:name="${_csrf?.parameterName}"
                   th:value="${_csrf?.token}" />

            <div class="flex justify-end gap-4 mt-4">
                <button type="button"
                        class="btn btn-outline"
                        onclick="closeAddReviewModal()">
                    Cancel
                </button>
                <button type="submit"
                        class="btn">
                    Add Review
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const stars = document.querySelectorAll('#starRating i');
    const ratingInput = document.getElementById('rating');
    let selectedRating = 0;

    // Highlight stars up to index
    function highlightStars(upTo) {
        stars.forEach(star => {
            const starValue = parseInt(star.getAttribute('data-value'));
            if (starValue <= upTo) {
                star.classList.remove('bi-star');
                star.classList.add('bi-star-fill');
            } else {
                star.classList.remove('bi-star-fill');
                star.classList.add('bi-star');
            }
        });
    }

    // Hover effect
    stars.forEach(star => {
        star.addEventListener('mouseover', () => {
            const value = parseInt(star.getAttribute('data-value'));
            highlightStars(value);
        });

        star.addEventListener('mouseout', () => {
            highlightStars(selectedRating);
        });

        // Click event
        star.addEventListener('click', () => {
            selectedRating = parseInt(star.getAttribute('data-value'));
            ratingInput.value = selectedRating;
            highlightStars(selectedRating);
        });
    });

    function openAddReviewModal() {
        const modal = document.getElementById("addReviewModal");
        modal.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
    }

    function closeAddReviewModal() {
        const modal = document.getElementById("addReviewModal");
        modal.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
    }

    // Close when clicking the backdrop
    document.getElementById("addReviewModal").addEventListener("click", function (event) {
        if (event.target === this) {
            closeAddReviewModal();
        }
    });

    // Close on Escape key
    window.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeAddReviewModal();
        }
    });
</script>
</body>
</html>
