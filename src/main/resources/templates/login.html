<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" th:href="@{/global.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen overflow-x-hidden flex items-center justify-center">

<div class="background opacity-75 -z-10 rounded-full top-[40vh] left-[10vw] absolute bg-[#ADE48B] blur-[120px] w-200 h-120"></div>
<div class="background opacity-65 -z-10 rounded-full top-[20vh] left-[45vw] absolute bg-[#FF47A0] blur-[100px] w-130 h-96"></div>


<form class="card-bg flex flex-col space-y-10 w-full max-w-150 p-10" th:action="@{/SlayScale/login}" method="post">
    <img class="h-auto w-full max-w-65 mx-auto pt-5" src="/assets/slayscale-wordmark-big.png"/>

    <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email"/>
    </div>

    <div th:classappend="${error} ? ' mb-4' : ''">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter your username"/>
    </div>

    <div class="rules error" th:if="${error}">
        <div class="mb-2" th:text="${error}"></div>
        <p>Enter a username and email you registered with</p>
    </div>

    <div class="mb-0">
        <button class="btn mb-4" type="submit">Login</button>

        <div class="text-xs italic flex justify-center gap-1">
            <p>Don't have an account?</p>
            <a href="/SlayScale/signup" class="underline">SignUp →</a>
        </div>
    </div>

    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
</form>


</body>
</html>
