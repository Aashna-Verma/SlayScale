<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Products</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" th:href="@{/global.css}" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="overflow-x-hidden">

<div class="blurry-bg fixed w-screen h-screen -z-10 top-0 left-0 absolute">
    <div class="background opacity-75 -z-10 rounded-full top-[40vh] left-[10vw] absolute bg-[#ADE48B] blur-[120px] w-200 h-120"></div>
    <div class="background opacity-65 -z-10 rounded-full top-[20vh] left-[45vw] absolute bg-[#FF47A0] blur-[100px] w-130 h-96"></div>
</div>

<!-- Nav -->
<div th:replace="fragments/navbar :: slayNav(${activeTab})"></div>


<section>
    <h2 class="text-4xl font-bold my-6">All Products</h2>

    <div class="flex justify-between gap-10 items-center mb-10">
        <!-- Filter by category -->
        <form th:action="@{/SlayScale/products}" method="get" class="w-full max-w-75 ">
            <label for="categoryFilter" class="mr-2 font-semibold uppercase">Filter by category:</label>
            <select id="categoryFilter"
                    name="category"
                    onchange="this.form.submit()"
                    class="!rounded-full !border-pink-400 px-4">

                <option value="">All</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.name()}"
                        th:text="${cat.name()}"
                        th:selected="${selectedCategory == cat.name()}">
                </option>
            </select>
        </form>

        <!-- Add New Product -->
        <button type="button"
                class="btn !text-3xl font-bold !w-18 !h-16 !p-0 flex items-center justify-center"
                onclick="openAddProductModal()">
            <img class="size-8" src="/assets/plus.svg"/>
        </button>


    </div>

    <!-- Product list -->
    <div th:if="${#lists.isEmpty(products)}" class=" muted">No products yet.</div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <a th:each="p : ${products}"
           class="card-bg !rounded-4xl flex flex-col w-full p-4 gap-2 "
           th:href="@{|/SlayScale/products/${p.id}|}"
           style="text-decoration:none; color:inherit;">

            <div class="w-full h-60 bg-gray-200 rounded-xl overflow-hidden border border-pink-300">
                <img th:if="${p.imageUrl != null}"
                     th:src="${p.imageUrl}"
                     class="w-full h-full object-cover"
                     onerror="this.style.display='none'; this.parentElement.classList.add('fallback');">
            </div>
            <p class="bg-pink-200 text-xs rounded-md p-1 px-2 w-fit" th:text="${p.category}">0</p>
            <p class="text-lg font-bold" th:text="${p.name}">0</p>
            <button type="button" class="btn float-right">View</button>
        </a>
    </div>
</section>

<!-- Add Product Modal -->
<div id="addProductModal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 hidden">

    <div class="card-bg !bg-white/70 m-4 flex flex-col space-y-10 w-full max-w-150 p-10 relative">

        <!-- Close button -->
        <button type="button"
                class="absolute top-10 right-10 text-gray-500 hover:text-gray-800"
                onclick="closeAddProductModal()">
            ✕
        </button>

        <h3 class="text-2xl font-bold">Add a Product</h3>

        <form class="flex flex-col space-y-10"
              th:action="@{/SlayScale/products}"
              method="post">

            <div>
                <label for="name" class="font-semibold">Name*</label>
                <input id="name"
                       name="name"
                       type="test"
                       placeholder="product name"/>
            </div>

            <div>
                <label for="url" class="font-semibold">Product URL*</label>
                <input id="url"
                       name="url"
                       type="url"
                       placeholder="https://example.com/item-link"/>
            </div>

            <div>
                <label for="imageUrl" class="font-semibold">Product Image URL</label>
                <input id="imageUrl"
                       name="imageUrl"
                       type="url"
                       placeholder="https://example.com/item-image"/>
            </div>

            <div >
                <label for="category" class="font-semibold">Category*</label>
                <select id="category"
                        name="category"
                        required>
                    <option value="">Select a category</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.name()}"
                            th:text="${cat.name()}">
                    </option>
                </select>
            </div>

            <input type="hidden"
                   th:name="${_csrf?.parameterName}"
                   th:value="${_csrf?.token}" />

            <div class="flex justify-end gap-4 mt-4">
                <button type="button"
                        class="btn btn-outline"
                        onclick="closeAddProductModal()">
                    Cancel
                </button>
                <button type="submit"
                        class="btn">
                    Add Product
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function openAddProductModal() {
        const modal = document.getElementById("addProductModal");
        modal.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
    }

    function closeAddProductModal() {
        const modal = document.getElementById("addProductModal");
        modal.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
    }

    // Close when clicking the backdrop
    document.getElementById("addProductModal").addEventListener("click", function (event) {
        if (event.target === this) {
            closeAddProductModal();
        }
    });

    // Close on Escape key
    window.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeAddProductModal();
        }
    });
</script>

</body>
</html>
